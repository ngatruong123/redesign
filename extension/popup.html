<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090b;
      color: #e4e4e7;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo svg { color: white; }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fafafa;
    }

    .header-text p {
      font-size: 11px;
      color: #71717a;
      margin-top: 1px;
    }

    .status {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #71717a;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.online { background: #22c55e; }

    .actions {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: #d4d4d8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }

    .btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.1);
      color: #fafafa;
    }

    .btn-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon.blue { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .btn-icon.purple { background: rgba(168,85,247,0.12); color: #c084fc; }
    .btn-icon.emerald { background: rgba(16,185,129,0.12); color: #6ee7b7; }
    .btn-icon.amber { background: rgba(245,158,11,0.12); color: #fbbf24; }

    .btn-label small {
      display: block;
      font-size: 11px;
      color: #52525b;
      font-weight: 400;
      margin-top: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      border-color: transparent;
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      color: white;
    }

    .btn.active {
      background: rgba(34,197,94,0.08);
      border-color: rgba(34,197,94,0.3);
      color: #6ee7b7;
    }

    .btn.active .btn-icon.emerald {
      background: rgba(34,197,94,0.2);
    }

    .btn.active small { color: #4ade80; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer a {
      font-size: 11px;
      color: #3b82f6;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    .footer span {
      font-size: 11px;
      color: #3f3f46;
    }

    .settings-row {
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-row label {
      font-size: 12px;
      color: #a1a1aa;
    }

    .settings-row input {
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: #e4e4e7;
      font-size: 11px;
      padding: 4px 8px;
      width: 160px;
      font-family: monospace;
    }

    .settings-row input:focus {
      outline: none;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 3l1.5 4.5H18l-3.5 2.5L16 14.5 12 11.5 8 14.5l1.5-4.5L6 7.5h4.5z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Design Tool</h1>
      <p>AI Mockup Generator</p>
    </div>
  </div>

  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Đang kiểm tra...</span>
  </div>

  <div class="settings-row">
    <label>Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:3000" />
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnOpen">
      <div class="btn-icon blue">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </div>
      <div class="btn-label">
        Mở Design Tool
        <small>Mở ứng dụng trong tab mới</small>
      </div>
    </button>

    <button class="btn" id="btnBadges">
      <div class="btn-icon emerald">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <div class="btn-label">
        <span id="badgesLabel">Bật chọn ảnh trên trang</span>
        <small id="badgesHint">Hiện icon trên mỗi ảnh — click để gửi vào tool</small>
      </div>
    </button>

    <button class="btn" id="btnScreenshot">
      <div class="btn-icon purple">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h3M15 3h3M21 6v3M21 15v3M18 21h-3M9 21H6M3 18v-3M3 9V6"/>
          <rect x="7" y="7" width="10" height="10" rx="1"/>
        </svg>
      </div>
      <div class="btn-label">
        Chụp vùng chọn
        <small>Kéo chuột chọn vùng → gửi screenshot vào tool</small>
      </div>
    </button>

    <button class="btn" id="btnFullScreenshot">
      <div class="btn-icon amber">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <div class="btn-label">
        Chụp toàn trang
        <small>Screenshot toàn bộ tab hiện tại</small>
      </div>
    </button>
  </div>

  <div class="footer">
    <a href="#" id="footerLink">Mở dashboard</a>
    <span>v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
